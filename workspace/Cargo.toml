[package]
name = "workspace"
version = "0.1.0"
authors = [ "whooie <wcwhuie@gmail.com>",]
edition = "2021"

[dependencies]
# anyhow = "*"
# thiserror = "*"
itertools = "0.13.0"
ndarray = { version = "0.15.6", features = [ "default", "rayon", "serde" ] }
ndarray-npy = "0.8.1"
num-complex = "0.4.6"
num-traits = "0.2.19"
once_cell = "1.20.2"
rand = "0.8.5"
rayon = "1.10.0"
tensor-net = { path = "../tensor-net", version = "*" }
# clifford-sim = { path = "/home/whooie/Documents/UIUC/01clifford_sim/clifford_sim", version = "*" }
clifford-sim = { git = "https://gitlab.com/whooie/clifford-sim", version = "*" }
nalgebra = "0.33.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_cbor = "0.11.2"

[dependencies.whooie]
git = "https://gitlab.com/whooie/rust-lib.git"
version = "*"
features = [ "ndarray-utils",]

[lib]
path = "lib/lib.rs"
name = "lib"

[[bin]]
path = "src/haar_gen_circuits.rs"
name = "haar_gen_circuits"

[[bin]]
path = "src/haar_coev_probs.rs"
name = "haar_coev_probs"

[[bin]]
path = "src/haar_coev_probs_follow_ones.rs"
name = "haar_coev_probs_follow_ones"

[profile.release]
lto = true
panic = "abort"
debug = true
